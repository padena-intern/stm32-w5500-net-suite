# mosquitto_test.conf
#
# Minimal local test broker: TLS 1.2 only, server-auth only (no client
# cert), forced to the same TLS_RSA_WITH_AES_128_GCM_SHA256 suite the
# STM32 firmware is built for.
#
# Run on your laptop after tools/gen_certs.sh <your-laptop-ip>:
#   mosquitto -c tools/mosquitto_test.conf -v
#
# Point the STM32 firmware's BROKER_IP (main.c) at this laptop's IP, and
# make sure the laptop's firewall allows inbound TCP on 8883 from the
# board's subnet.

listener 8883
protocol mqtt

cafile   certs/ca.crt
certfile certs/server.crt
keyfile  certs/server.key

# Server-auth only: broker does NOT ask the board for a client cert.
require_certificate false

tls_version tlsv1.2
ciphers AES128-GCM-SHA256

# No authentication beyond TLS for this bench test. Add password_file /
# acl_file here before this ever leaves your bench.
allow_anonymous true

log_type all
